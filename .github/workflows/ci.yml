name: StomoApp Production CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-verification:
    name: Backend Lint, Build & Integration Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dentacare
          POSTGRES_PASSWORD: dentacare_dev_password
          POSTGRES_DB: dentacare_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Prisma Schema Validation & Client Generation
        working-directory: ./backend
        run: |
          npx prisma validate
          npx prisma generate

      - name: Backend Lint Check
        working-directory: ./backend
        run: npm run lint

      - name: Backend Build Compilation
        working-directory: ./backend
        run: npm run build

      - name: Apply Database Migrations (dentacare_test)
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://dentacare:dentacare_dev_password@localhost:5432/dentacare_test?schema=public
        run: npx prisma migrate deploy

      - name: Run Jest E2E Test Suite
        working-directory: ./backend
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://dentacare:dentacare_dev_password@localhost:5432/dentacare_test?schema=public
          TEST_DATABASE_URL: postgresql://dentacare:dentacare_dev_password@localhost:5432/dentacare_test?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_jwt_secret_ci_key_2026_dev_secure
          JWT_REFRESH_SECRET: test_jwt_refresh_ci_key_2026_dev_secure
          DEFAULT_TIMEZONE: Asia/Tashkent
          DEFAULT_LOCALE: uz
        run: npx jest --config ./test/jest-e2e.json --runInBand

      - name: Run Comprehensive Verification Checks
        working-directory: ./backend
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://dentacare:dentacare_dev_password@localhost:5432/dentacare_test?schema=public
          TEST_DATABASE_URL: postgresql://dentacare:dentacare_dev_password@localhost:5432/dentacare_test?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_jwt_secret_ci_key_2026_dev_secure
          JWT_REFRESH_SECRET: test_jwt_refresh_ci_key_2026_dev_secure
          DEFAULT_TIMEZONE: Asia/Tashkent
          DEFAULT_LOCALE: uz
        run: npx ts-node scripts/verify-all-priorities.ts

  frontend-verification:
    name: Frontend Typecheck, Lint & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: TypeScript Typecheck
        working-directory: ./frontend
        run: npx tsc -p tsconfig.json --noEmit

      - name: Frontend Lint Check
        working-directory: ./frontend
        run: npm run lint

      - name: Next.js Production Build
        working-directory: ./frontend
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_API_URL: http://localhost:4000
        run: npm run build

  bot-verification:
    name: Telegram Bot Flow Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Bot Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r bot/requirements.txt pytest pytest-asyncio anyio

      - name: Run Bot Suite
        env:
          ENVIRONMENT: test
        run: pytest bot/test_bot_suite.py

