# Render Blueprint: the backend (API) on a free web service. See DEPLOY-FREE.md.
# The website itself (frontend) goes to Vercel/Netlify, the database to Neon.
services:
  - type: web
    name: stomoapp-api
    runtime: docker
    region: frankfurt
    plan: free
    branch: dev # change to main once the release is merged there
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health/live # never touches the database
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_PORT
        value: "10000"
      - key: PORT
        value: "10000"
      # Neon connection string (the direct one, with sslmode=require). Paste it when Render asks.
      - key: DATABASE_URL
        sync: false
      # Random secrets generated by Render, never stored in the repository
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: SERVICE_TOKEN
        generateValue: true
      # First OWNER account, created on the first start only (see backend/scripts/ensure-owner.js).
      # The password is generated: read it in Render > Environment > OWNER_PASSWORD.
      - key: OWNER_EMAIL
        value: owner@stomoapp.demo
      - key: OWNER_NAME
        value: Demo Owner
      - key: OWNER_PASSWORD
        generateValue: true
      # Public addresses. Update FRONTEND_URL / PUBLIC_SITE_URL to the real website address after the
      # frontend is deployed (and APP_URL if Render gave the service another name).
      - key: FRONTEND_URL
        value: https://stomoapp.vercel.app
      - key: PUBLIC_SITE_URL
        value: https://stomoapp.vercel.app
      - key: APP_URL
        value: https://stomoapp-api.onrender.com
      - key: STORAGE_DRIVER
        value: local # free instances have no disk: uploaded files vanish on restart (fine for a demo)
      - key: TRUST_PROXY
        value: "2" # visitor -> Vercel -> Render -> app
      - key: DEFAULT_TIMEZONE
        value: Asia/Tashkent
      - key: DEFAULT_LOCALE
        value: uz
